name: ParolaApp
options:
  bundleIdPrefix: app.parola
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: Parola
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  ParolaCore:
    path: ../ParolaCore
targets:
  ParolaApp:
    type: application
    platform: macOS
    sources:
      - path: ParolaApp
        excludes:
          - "Resources/Assets.xcassets/AppIcon.appiconset/.gitkeep"
    info:
      path: ParolaApp/Info.plist
      properties:
        CFBundleName: Parola
        CFBundleDisplayName: Parola
        CFBundleIdentifier: app.parola.ParolaApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: YES
        NSMicrophoneUsageDescription: Parola records audio from the microphone to transcribe it locally.
        NSSystemAudioCaptureUsageDescription: Parola captures system audio so it can transcribe what's playing on your Mac.
        NSAppleEventsUsageDescription: Allow Parola to handle file actions.
    entitlements:
      path: ParolaApp/Parola.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    dependencies:
      - package: ParolaCore
        product: ParolaCore
