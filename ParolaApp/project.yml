name: ParolaApp
options:
  bundleIdPrefix: app.parola
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: Parola
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  ParolaCore:
    path: ../ParolaCore
targets:
  ParolaApp:
    type: application
    platform: macOS
    sources:
      - path: ParolaApp
        excludes:
          - "Resources/Assets.xcassets/AppIcon.appiconset/.gitkeep"
    info:
      path: ParolaApp/Info.plist
      properties:
        CFBundleName: Parola
        CFBundleDisplayName: Parola
        CFBundleIdentifier: app.parola.ParolaApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: YES
        NSMicrophoneUsageDescription: Parola records audio from the microphone to transcribe it locally.
        NSSystemAudioCaptureUsageDescription: Parola captures system audio so it can transcribe what's playing on your Mac.
        NSAppleEventsUsageDescription: Allow Parola to handle file actions.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: Parola Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.parola.document
            LSTypeIsPackage: YES
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.parola.document
            UTTypeDescription: Parola Document
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - parola
        NSServices:
          - NSMessage: transcribeFile
            NSPortName: Parola
            NSMenuItem:
              default: Transcribe with Parola
            NSSendTypes:
              - public.file-url
              - NSFilenamesPboardType
          - NSMessage: translateFile
            NSPortName: Parola
            NSMenuItem:
              default: Translate with Parola to English
            NSSendTypes:
              - public.file-url
              - NSFilenamesPboardType
    entitlements:
      path: ParolaApp/Parola.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    dependencies:
      - package: ParolaCore
        product: ParolaCore
      - target: ParolaQuickLook
        embed: true

  ParolaQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: ParolaQuickLook
    info:
      path: ParolaQuickLook/Info.plist
      properties:
        CFBundleDisplayName: Parola Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ParolaPreviewProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - app.parola.document
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.parola.ParolaApp.QuickLook
        PRODUCT_NAME: ParolaQuickLook
        PRODUCT_MODULE_NAME: ParolaQuickLook
        CODE_SIGN_ENTITLEMENTS: ParolaQuickLook/ParolaQuickLook.entitlements
    dependencies:
      - package: ParolaCore
        product: ParolaCore
