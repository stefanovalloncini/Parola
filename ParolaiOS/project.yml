name: ParolaiOS
options:
  bundleIdPrefix: app.parola
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    PRODUCT_NAME: Parola
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  ParolaCore:
    path: ../ParolaCore
targets:
  ParolaiOS:
    type: application
    platform: iOS
    sources:
      - path: ParolaiOS
    info:
      path: ParolaiOS/Info.plist
      properties:
        CFBundleName: Parola
        CFBundleDisplayName: Parola
        CFBundleIdentifier: app.parola.ParolaiOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: YES
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Parola records audio from the microphone to transcribe it on-device.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
          - CFBundleTypeName: Parola Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.parola.document
            LSTypeIsPackage: YES
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.parola.document
            UTTypeDescription: Parola Document
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - parola
        LSSupportsOpeningDocumentsInPlace: NO
    dependencies:
      - package: ParolaCore
        product: ParolaCore

  ParolaiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParolaiOSTests
    resources:
      - path: ParolaiOSTests/Resources
    dependencies:
      - target: ParolaiOS
      - package: ParolaCore
    settings:
      base:
        PRODUCT_NAME: ParolaiOSTests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Parola.app/Parola"

schemes:
  ParolaiOS:
    build:
      targets:
        ParolaiOS: all
        ParolaiOSTests: [test]
    test:
      targets:
        - ParolaiOSTests
